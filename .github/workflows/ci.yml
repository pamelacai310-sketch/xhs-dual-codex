name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate extension syntax
        run: |
          node --check extension/src/lib.js
          node --check extension/src/injected.js
          node --check extension/src/content.js
          node --check extension/src/background.js
          node --check extension/popup.js

      - name: Test extension
        run: node --test extension/tests/lib.test.js extension/tests/release-guards.test.js

      - name: Test project builder
        run: python3 -m unittest discover -s builder/tests -v

      - name: Rebuild and verify release archive
        run: python3 tools/package_release.py
